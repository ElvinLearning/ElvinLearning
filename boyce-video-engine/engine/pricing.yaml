# Per-second list prices, USD. August 2026. VERIFY BEFORE RELYING ON THESE — this space moves
# monthly. Everything in `engine/cli.py cost` reads from here, so this file is the only place to
# update when prices change.
#
# Sources: cometapi.com/ai-video-api-pricing, modelslab.com, buildmvpfast.com/api-costs/ai-video,
#          cellcog.ai/blog/seedance-2-5-pricing

video:
  seedance_2_5:
    720p:  0.473          # audio included; token-metered upstream
    480p:  0.2205
    1080p: 0.95           # estimate — confirm with provider before budgeting
  seedance_2_0:
    720p:  0.30
    1080p: 0.55
  kling3_0:
    std:   0.029          # cheapest per-second at scale via fal
    pro:   0.112
    4k:    0.20
  veo3_1:
    lite_720p: 0.03
    lite_1080p: 0.05
    standard:  0.75       # native 4K, best-in-market lip-sync
  minimax_h3:
    2k: 0.20
  # Sora 2 deliberately omitted: API shuts down 2026-09-24. Do not build on it.

# Flat per-clip costs for the audio-driven lip-sync route (priced per generation, not per second)
lipsync:
  hedra_character_3: 0.35
  heygen_avatar_iv:  0.50

audio:
  elevenlabs_v3:
    per_1k_chars: 0.30
  fish_audio_s2:
    per_1k_chars: 0.05
